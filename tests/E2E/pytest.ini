[pytest]
# The end-to-end suite: a real MCP client (the official Python SDK) against
# bin/mcp-rector-warm. Run it through tests/E2E/run.sh; see CONTRIBUTING.md.
testpaths = .
pythonpath = .
# A known defect is an xfail naming its issue. Strict, so the day the fix lands
# the test flips to XPASS, fails, and the marker gets removed with the fix.
xfail_strict = true
# Every test spawns PHP; a hung server must fail the test, not the CI job.
timeout = 600
# Slowest tests at the end of every run, so a slow one is visible without CI archaeology.
addopts = -ra --durations=10

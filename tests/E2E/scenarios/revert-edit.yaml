description: An edit and its revert; the warm container follows the file back to its original state.
files:
  src/Probe.php: |
    <?php

    declare(strict_types=1);

    final class Probe
    {
        public function __construct(private int $value)
        {
        }
    }
steps:
  - call: src/Probe.php
    expect: {changed: 0}
  - edit:
      path: src/Probe.php
      old: "private int $value"
      new: "private readonly int $value"
  - call: src/Probe.php
    expect:
      changed: 1
      diff_contains: "+final readonly class Probe"
  - edit:
      path: src/Probe.php
      old: "private readonly int $value"
      new: "private int $value"
  - call: src/Probe.php
    expect: {changed: 0}

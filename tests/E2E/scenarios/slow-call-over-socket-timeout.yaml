xfail: "#32: runForked() reads the child result with the socket read timeout, so a call longer than default_socket_timeout reports no output"
description: A call whose analysis outlasts default_socket_timeout must still return its result, as cold Rector does.
# The server gets a 3s socket timeout so a 5s rule reproduces the 60s default in seconds.
php_ini:
  default_socket_timeout: 3
config: |
  <?php

  declare(strict_types=1);

  use PhpParser\Node;
  use PhpParser\Node\Stmt\Class_;
  use Rector\Config\RectorConfig;
  use Rector\Php82\Rector\Class_\ReadOnlyClassRector;
  use Rector\Rector\AbstractRector;
  use Rector\ValueObject\PhpVersion;

  // Stands in for a large file or a slow rule set: an analysis longer than the socket timeout.
  final class SlowRector extends AbstractRector
  {
      public function getNodeTypes(): array
      {
          return [Class_::class];
      }

      public function refactor(Node $node): ?Node
      {
          sleep(5);

          return null;
      }
  }

  return RectorConfig::configure()
      ->withPaths([__DIR__ . "/src"])
      ->withPhpVersion(PhpVersion::PHP_83)
      ->withRules([SlowRector::class, ReadOnlyClassRector::class]);
files:
  src/Money.php: |
    <?php

    declare(strict_types=1);

    final class Money
    {
        public function __construct(private readonly int $amount)
        {
        }
    }
steps:
  - call: src/Money.php
    expect:
      is_error: false
      changed: 1
      diff_contains: "+final readonly class Money"

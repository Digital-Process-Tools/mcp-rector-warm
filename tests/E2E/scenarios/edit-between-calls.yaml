description: An edit made between two calls on the same file is seen by the warm container.
files:
  src/Probe.php: |
    <?php

    declare(strict_types=1);

    final class Probe
    {
        public function add(int $first, int $second): int
        {
            return $first + $second;
        }
    }
steps:
  - call: src/Probe.php
    expect: {changed: 0}
  - write:
      path: src/Probe.php
      content: |
        <?php

        declare(strict_types=1);

        final class Probe
        {
            public function __construct(private readonly int $value)
            {
            }
        }
  - call: src/Probe.php
    expect:
      changed: 1
      diff_contains: "+final readonly class Probe"

description: An interface gains a constant the implementing class already defines; AddTypeToConstRector stops typing a constant guarded by a parent.
# Enum-implements-interface is not covered: neither rule used here (nor
# AddOverrideAttributeToOverriddenMethodsRector) visits Enum_ nodes.
config: |
  <?php

  declare(strict_types=1);

  use Rector\Config\RectorConfig;
  use Rector\Php83\Rector\ClassConst\AddTypeToConstRector;
  use Rector\ValueObject\PhpVersion;

  return RectorConfig::configure()
      ->withPaths([__DIR__ . '/src'])
      ->withAutoloadPaths([__DIR__ . '/src'])
      ->withPhpVersion(PhpVersion::PHP_83)
      ->withRules([AddTypeToConstRector::class]);
files:
  src/Contract.php: |
    <?php

    declare(strict_types=1);

    interface Contract
    {
    }
  src/Handler.php: |
    <?php

    declare(strict_types=1);

    final class Handler implements Contract
    {
        public const NAME = 'handler';
    }
steps:
  - call: src/Handler.php
    expect:
      changed: 1
      diff_contains: '+    public const string NAME'
  - edit:
      path: src/Contract.php
      old: "interface Contract\n{\n}"
      new: "interface Contract\n{\n    public const NAME = 'contract';\n}"
  # Only the interface changed on disk; Handler.php is byte-identical to the first call.
  - call: src/Handler.php
    expect: {changed: 0}

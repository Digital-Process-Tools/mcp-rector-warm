description: A child that stops extending its parent mid-session must no longer be proposed #[\Override] on foo().
files:
  src/Base.php: |
    <?php

    declare(strict_types=1);

    class Base
    {
        public function foo(): void
        {
            echo 'base';
        }
    }
  src/Child.php: |
    <?php

    declare(strict_types=1);

    final class Child extends Base
    {
        public function foo(): void
        {
            echo 'child';
        }
    }
steps:
  - call: src/Child.php
    expect:
      changed: 1
      diff_contains: '+    #[\Override]'
  - edit:
      path: src/Child.php
      old: "final class Child extends Base\n"
      new: "final class Child\n"
  - call: src/Child.php
    expect: {changed: 0}

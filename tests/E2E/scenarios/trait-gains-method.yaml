description: A trait used by the parent class gains the overridden method mid-session.
xfail: "#19: an edit to a trait of the parent class is not seen by the warm container (stale reflection)"
files:
  src/Greets.php: |
    <?php

    declare(strict_types=1);

    trait Greets
    {
    }
  src/Base.php: |
    <?php

    declare(strict_types=1);

    class Base
    {
        use Greets;
    }
  src/Child.php: |
    <?php

    declare(strict_types=1);

    final class Child extends Base
    {
        public function hello(): string
        {
            return 'child';
        }
    }
steps:
  - call: src/Child.php
    expect: {changed: 0}
  - write:
      path: src/Greets.php
      content: |
        <?php

        declare(strict_types=1);

        trait Greets
        {
            public function hello(): string
            {
                return 'trait';
            }
        }
  - call: src/Child.php
    expect:
      changed: 1
      diff_contains: '+    #[\Override]'

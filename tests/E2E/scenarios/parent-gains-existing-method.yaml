description: A child already defines bar(); its parent gains a non-empty bar() mid-session, so bar() in the child now overrides it.
files:
  src/Base.php: |
    <?php

    declare(strict_types=1);

    class Base
    {
    }
  src/Child.php: |
    <?php

    declare(strict_types=1);

    final class Child extends Base
    {
        public function bar(): string
        {
            return 'child';
        }
    }
steps:
  - call: src/Child.php
    expect: {changed: 0}
  - edit:
      path: src/Base.php
      old: "class Base\n{\n}"
      new: "class Base\n{\n    public function bar(): string\n    {\n        return 'base';\n    }\n}"
  # Only the parent changed on disk; Child.php is byte-identical to the first call.
  - call: src/Child.php
    expect:
      changed: 1
      diff_contains: '+    #[\Override]'

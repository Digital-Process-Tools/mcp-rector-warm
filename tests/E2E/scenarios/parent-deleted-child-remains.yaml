description: The parent class file is deleted while the child still extends it; the parent must not linger.
files:
  src/Base.php: |
    <?php

    declare(strict_types=1);

    class Base
    {
        public function run(): void
        {
            echo "base";
        }
    }
  src/Child.php: |
    <?php

    declare(strict_types=1);

    final class Child extends Base
    {
        public function run(): void
        {
            echo "child";
        }
    }
steps:
  - call: src/Child.php
    expect:
      changed: 1
      diff_contains: "+    #[\\Override]"
  - delete: src/Base.php
  - call: src/Child.php
    expect: {changed: 0}

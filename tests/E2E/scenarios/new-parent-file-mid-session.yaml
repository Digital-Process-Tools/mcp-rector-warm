description: A parent file that did not exist when the session booted is created, and the child switches its extends to it.
files:
  src/OldBase.php: |
    <?php

    declare(strict_types=1);

    class OldBase
    {
    }
  src/Child.php: |
    <?php

    declare(strict_types=1);

    final class Child extends OldBase
    {
        public function foo(): void
        {
            echo 'child';
        }
    }
steps:
  - call: src/Child.php
    expect: {changed: 0}
  - write:
      path: src/NewBase.php
      content: |
        <?php

        declare(strict_types=1);

        class NewBase
        {
            public function foo(): void
            {
                echo 'new base';
            }
        }
  - edit:
      path: src/Child.php
      old: "extends OldBase"
      new: "extends NewBase"
  - call: src/Child.php
    expect:
      changed: 1
      diff_contains: '+    #[\Override]'

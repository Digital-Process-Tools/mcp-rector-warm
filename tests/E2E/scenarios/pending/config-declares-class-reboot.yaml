description: A rector.php that declares a class fails to boot, is fixed, and the next call boots again; re-requiring the config must not kill the server.
# Oracle off: the failing first call is a tool error warm and a CLI fatal_errors report cold, by design.
oracle: false
config: |
  <?php

  declare(strict_types=1);

  use Rector\Config\RectorConfig;
  use Rector\Php82\Rector\Class_\ReadOnlyClassRector;
  use Rector\ValueObject\PhpVersion;

  // Any class or function declared at the top level of rector.php (an inline custom rule, a helper).
  final class HelperDeclaredInConfig
  {
  }

  return RectorConfig::configure()
      ->withPaths([__DIR__ . "/src"])
      ->withPhpVersion(PhpVersion::PHP_83)
      ->withRules([ReadOnlyClassRector::class, NoSuchRector::class]);
files:
  src/Money.php: |
    <?php

    declare(strict_types=1);

    final class Money
    {
        public function __construct(private readonly int $amount)
        {
        }
    }
steps:
  # The unknown rule makes the first boot throw, after the class above was declared.
  - call: src/Money.php
    expect:
      is_error: true
  - edit:
      path: rector.php
      old: ", NoSuchRector::class"
      new: ""
  - call: src/Money.php
    expect:
      is_error: false
      changed: 1
      diff_contains: "+final readonly class Money"

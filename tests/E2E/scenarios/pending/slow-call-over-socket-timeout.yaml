description: A call whose analysis runs longer than PHP default_socket_timeout (60s) must still return its result, as cold Rector does.
config: |
  <?php

  declare(strict_types=1);

  use PhpParser\Node;
  use PhpParser\Node\Stmt\Class_;
  use Rector\Config\RectorConfig;
  use Rector\Php82\Rector\Class_\ReadOnlyClassRector;
  use Rector\Rector\AbstractRector;
  use Rector\ValueObject\PhpVersion;

  // Stands in for a large file or a slow rule set: any analysis over 60 seconds.
  final class SlowRector extends AbstractRector
  {
      public function getNodeTypes(): array
      {
          return [Class_::class];
      }

      public function refactor(Node $node): ?Node
      {
          sleep(65);

          return null;
      }
  }

  return RectorConfig::configure()
      ->withPaths([__DIR__ . "/src"])
      ->withPhpVersion(PhpVersion::PHP_83)
      ->withRules([SlowRector::class, ReadOnlyClassRector::class]);
files:
  src/Money.php: |
    <?php

    declare(strict_types=1);

    final class Money
    {
        public function __construct(private readonly int $amount)
        {
        }
    }
steps:
  - call: src/Money.php
    expect:
      is_error: false
      changed: 1
      diff_contains: "+final readonly class Money"

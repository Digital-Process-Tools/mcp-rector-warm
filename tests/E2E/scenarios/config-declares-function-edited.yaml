description: A valid rector.php that declares a top-level FUNCTION (not only a class) is edited mid-session; the forced reboot (#20) must not kill the server (#31).
config: |
  <?php

  declare(strict_types=1);

  use Rector\Config\RectorConfig;
  use Rector\Php82\Rector\Class_\ReadOnlyClassRector;
  use Rector\Php83\Rector\ClassMethod\AddOverrideAttributeToOverriddenMethodsRector;
  use Rector\ValueObject\PhpVersion;

  // A top-level FUNCTION declared in rector.php (an inline helper), distinct from
  // the class-declaring siblings of this scenario (config-declares-class-*.yaml):
  // PHP's redeclare fatal fires the same way for a function as for a class.
  function helperDeclaredInConfig(): bool
  {
      return true;
  }

  return RectorConfig::configure()
      ->withPaths([__DIR__ . "/src"])
      ->withPhpVersion(PhpVersion::PHP_83)
      ->withRules([AddOverrideAttributeToOverriddenMethodsRector::class]);
files:
  src/Money.php: |
    <?php

    declare(strict_types=1);

    final class Money
    {
        public function __construct(private readonly int $amount)
        {
        }
    }
steps:
  # Positive control: the config boots and runs; the only rule has nothing to do here.
  - call: src/Money.php
    expect: {changed: 0}
  - edit:
      path: rector.php
      old: "->withRules([AddOverrideAttributeToOverriddenMethodsRector::class]);"
      new: "->withRules([AddOverrideAttributeToOverriddenMethodsRector::class, ReadOnlyClassRector::class]);"
  - call: src/Money.php
    expect:
      is_error: false
      changed: 1
      diff_contains: "+final readonly class Money"

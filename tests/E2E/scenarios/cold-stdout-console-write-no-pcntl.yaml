description: "Without pcntl (#18), Rector's own console output (e.g. a deprecated-set warning) writing straight to the cold child's real stdout must not corrupt a successful result: runCold() used to decode stdout itself as the JSON result, so any non-JSON text Rector wrote there made a successful analysis look like it produced no output (#46)."
oracle: false
php_ini:
  disable_functions: pcntl_fork
config: |
  <?php

  declare(strict_types=1);

  use Rector\Config\RectorConfig;
  use Rector\Php82\Rector\Class_\ReadOnlyClassRector;
  use Rector\Set\ValueObject\SetList;
  use Rector\ValueObject\PhpVersion;

  // SetList::PHP_82 is one of the deprecated per-version PHP sets: passing it to
  // withSets() makes Rector's own Notifier::notifyDeprecatedPhpSet() build a
  // SymfonyStyle bound to a real ConsoleOutput and print a warning box straight to
  // this process's actual stdout -- bypassing ob_start() and display_errors
  // entirely, since it never goes through PHP's own error-display machinery (#46).
  return RectorConfig::configure()
      ->withPaths([__DIR__ . "/src"])
      ->withPhpVersion(PhpVersion::PHP_83)
      ->withSets([SetList::PHP_82])
      ->withRules([ReadOnlyClassRector::class]);
files:
  src/Money.php: |
    <?php

    declare(strict_types=1);

    final class Money
    {
        public function __construct(private readonly int $amount)
        {
        }
    }
steps:
  - call: src/Money.php
    expect:
      is_error: false
      changed: 1
      diff_contains: "+final readonly class Money"

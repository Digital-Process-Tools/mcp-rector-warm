description: The parent class is renamed (file and class) and the child re-pointed; the old parent must not linger in the warm container.
xfail: "#19: after the parent is renamed and the child re-pointed, the warm container still answers from the old parent (stale reflection)"
files:
  src/Base.php: |
    <?php

    declare(strict_types=1);

    class Base
    {
        public function run(): void
        {
            echo 'base';
        }
    }
  src/Child.php: |
    <?php

    declare(strict_types=1);

    final class Child extends Base
    {
        public function run(): void
        {
            echo 'child';
        }
    }
steps:
  # Positive control: with a non-empty parent method, the attribute is added.
  - call: src/Child.php
    expect:
      changed: 1
      diff_contains: '+    #[\Override]'
  - rename:
      from: src/Base.php
      to: src/Renamed.php
  - write:
      path: src/Renamed.php
      content: |
        <?php

        declare(strict_types=1);

        class Renamed
        {
            public function run(): void
            {
            }
        }
  - edit:
      path: src/Child.php
      old: "extends Base"
      new: "extends Renamed"
  # The new parent's method is empty, so nothing to add; a stale Base would still say 1.
  - call: src/Child.php
    expect: {changed: 0}

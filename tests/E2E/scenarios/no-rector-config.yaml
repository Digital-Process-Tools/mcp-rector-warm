description: A project with no rector.php; the call still answers, and nothing but JSON-RPC reaches stdout.
config: null
# Cold `vendor/bin/rector process` on this same tree treats a missing config as
# friendly onboarding: it prints a warning and reports success for a no-op
# (#14). This is exactly the behaviour the fix refuses to reproduce -- warm
# and cold are deliberately different here, so the cold oracle comparison
# does not apply to this scenario.
oracle: false
files:
  src/Probe.php: |
    <?php

    declare(strict_types=1);

    final class Probe
    {
    }
steps:
  - call: src/Probe.php
    expect:
      is_error: false
      error_class: RuntimeException

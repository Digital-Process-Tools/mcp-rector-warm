description: "Without pcntl (#18, php -d disable_functions=pcntl_fork), a rector.php that declares a class must not crash the second call: every call now boots cold in its own subprocess instead of rebooting the daemon's own process in place (#31)."
oracle: false
php_ini:
  disable_functions: pcntl_fork
config: |
  <?php

  declare(strict_types=1);

  use Rector\Config\RectorConfig;
  use Rector\Php82\Rector\Class_\ReadOnlyClassRector;
  use Rector\ValueObject\PhpVersion;

  // Any class or function declared at the top level of rector.php (an inline custom rule, a helper).
  final class HelperDeclaredInConfigNoPcntl
  {
  }

  return RectorConfig::configure()
      ->withPaths([__DIR__ . "/src"])
      ->withPhpVersion(PhpVersion::PHP_83)
      ->withRules([ReadOnlyClassRector::class]);
files:
  src/Money.php: |
    <?php

    declare(strict_types=1);

    final class Money
    {
        public function __construct(private readonly int $amount)
        {
        }
    }
steps:
  # Without pcntl, every call reboots -- so a second call, with no edit at all,
  # already re-requires the class-declaring rector.php a second time and used to
  # crash the daemon (#31, #18). Two calls, no edit, is the whole reproduction.
  - call: src/Money.php
    expect:
      is_error: false
      changed: 1
      diff_contains: "+final readonly class Money"
  - call: src/Money.php
    expect:
      is_error: false
      changed: 1
      diff_contains: "+final readonly class Money"

description: A class that gains `implements NewInterface` mid-session, whose interface declares foo(), gets #[\Override] on foo().
config: |
  <?php

  declare(strict_types=1);

  use Rector\Config\RectorConfig;
  use Rector\Php83\Rector\ClassMethod\AddOverrideAttributeToOverriddenMethodsRector;
  use Rector\ValueObject\PhpVersion;

  return RectorConfig::configure()
      ->withPaths([__DIR__ . '/src'])
      ->withAutoloadPaths([__DIR__ . '/src'])
      ->withPhpVersion(PhpVersion::PHP_83)
      ->withConfiguredRule(AddOverrideAttributeToOverriddenMethodsRector::class, [
          AddOverrideAttributeToOverriddenMethodsRector::ADD_TO_INTERFACE_METHODS => true,
      ]);
files:
  src/NewInterface.php: |
    <?php

    declare(strict_types=1);

    interface NewInterface
    {
        public function foo(): void;
    }
  src/Handler.php: |
    <?php

    declare(strict_types=1);

    final class Handler
    {
        public function foo(): void
        {
            echo 'handled';
        }
    }
steps:
  - call: src/Handler.php
    expect: {changed: 0}
  - edit:
      path: src/Handler.php
      old: "final class Handler\n"
      new: "final class Handler implements NewInterface\n"
  - call: src/Handler.php
    expect:
      changed: 1
      diff_contains: '+    #[\Override]'

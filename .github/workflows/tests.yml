name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # OS matrix rationale (#96/#97/#98): the ubuntu-latest legs keep the full
  # PHP matrix (compatibility is what THAT axis tests); windows-latest and
  # macos-latest each add exactly one PHP version via `include` -- their
  # job is to exercise the OS, not re-run PHP-version compatibility a third
  # and fourth time.
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4']
        include:
          # Windows: no pcntl, so RectorRunner::canFork() is false and the
          # standby worker process path (#108) is the real path here --
          # that is the point of this leg, not a gap in it (#97).
          - os: windows-latest
            php: '8.3'
          # macOS: the maintainer's and the main consumer's actual platform,
          # and where #79's BSD `ps` column parsing is observed rather than
          # reasoned (#98).
          - os: macos-latest
            php: '8.3'
      fail-fast: false

    steps:
      # #97: deliberate, not inherited -- a Windows runner's default
      # core.autocrlf would rewrite every checked-out LF file to CRLF before
      # a single test runs, making any line-ending result an accident of the
      # runner rather than something this suite chose.
      - name: Configure git line endings
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          # #97 CI fix: mcp/sdk requires ext-fileinfo. ubuntu-latest/
          # macos-latest ship it enabled by default; windows-latest does
          # not, so `composer install` failed there before any test ran.
          # intl/mbstring: the Rector cold path calls Normalizer (ext-intl);
          # windows-latest ships intl disabled, which failed the
          # cold-stdout-console-write-no-pcntl E2E scenario there.
          extensions: fileinfo, intl, mbstring

      # #97 self-review finding: ~/.composer/cache is not composer's real
      # cache directory on Windows (typically under %LOCALAPPDATA%), so a
      # hardcoded path there would silently cache nothing on that leg --
      # not a failure, just a permanently-cold composer install every run.
      # `composer config cache-files-dir` asks composer itself, cross-OS.
      - name: Get composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.os }}-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # #97 self-review finding: windows-latest's default shell is pwsh, and
      # a path-qualified, extension-less script (./vendor/bin/phpunit, no
      # .bat/.ps1 suffix) is a known PHP-on-Windows-CI trap under pwsh's own
      # command resolution. `shell: bash` routes through Git Bash instead,
      # same choice the e2e job below already makes for its own script.
      # #97 follow-up: the windows-latest leg failed with "OK, but there were
      # issues!" (1 warning trips phpunit.xml's failOnWarning="true") but the
      # captured GH Actions log did not include PHPUnit's own "There was 1
      # warning: ..." detail block -- only the summary counted it. --no-progress
      # and --colors=never stop the \r-driven progress bar and ANSI codes from
      # being mangled by the log capture, and --display-warnings makes PHPUnit
      # print the warning detail unconditionally (it can be display-suppressed
      # otherwise). No behavior change to which tests run or pass/fail.
      - name: Run tests
        shell: bash
        run: ./vendor/bin/phpunit --no-coverage --colors=never --no-progress --display-warnings

  # No-pcntl path: the ubuntu-latest matrix above always has pcntl, so
  # RectorRunner::canFork() is always true there and the no-pcntl standby
  # worker (#108) would only run on the windows-latest leg. This job disables
  # pcntl_fork/pcntl_waitpid/stream_socket_pair via php.ini so the real
  # boot()/reboot()/execute() sequence in tests/Integration/ServerStdioTest.php
  # runs the fallback path for real, over a real subprocess. One PHP version:
  # it exercises the fallback branch, not PHP compatibility, which the matrix
  # above already covers.
  #
  # Deliberately kept ubuntu-only rather than also gaining OS legs (#97/#98
  # asked about the unit/e2e jobs, not this one): windows-latest genuinely
  # has no pcntl at all, so it already exercises this same fallback path for
  # real, as a side effect of being Windows -- the `tests` job's own
  # windows-latest leg covers that, and duplicating this job's ini-disabling
  # trick there would test the identical thing a second way.
  no-pcntl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP (pcntl disabled)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          ini-values: 'disable_functions="pcntl_fork,pcntl_waitpid,stream_socket_pair"'

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-no-pcntl-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Confirm pcntl is actually disabled
        run: |
          php -r '
            foreach (["pcntl_fork", "pcntl_waitpid", "stream_socket_pair"] as $f) {
              if (function_exists($f)) {
                fwrite(STDERR, "$f is still callable — the no-pcntl leg is not testing what it claims\n");
                exit(1);
              }
            }
            echo "pcntl_fork, pcntl_waitpid and stream_socket_pair are all disabled\n";
          '

      - name: Run tests without pcntl
        run: ./vendor/bin/phpunit --no-coverage --testsuite unit,integration

  # End-to-end: the official Python MCP client drives bin/mcp-rector-warm over
  # stdio as a host would, plus the warm-vs-cold scenario harness. One PHP version:
  # it tests the protocol and the warm container, not PHP compatibility, which the
  # matrix above already covers. Known defects are strict xfails naming their issue.
  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      # Same rationale as the tests job above (#97): deliberate, not
      # inherited from the runner's own default.
      - name: Configure git line endings
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          # Same fix as the tests job above (#97): fileinfo is not enabled
          # by default on windows-latest, unlike ubuntu-latest/macos-latest.
          # intl/mbstring: same reason as the tests job above (Normalizer).
          extensions: fileinfo, intl, mbstring

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/E2E/requirements.txt

      # Second-pass self-review finding: the same Windows-cache-path fix
      # applied to the `tests` job above was missed here on the first pass,
      # even though this job carries the identical exposure.
      - name: Get composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-e2e-${{ matrix.os }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        shell: bash
        run: |
          composer install --no-progress --prefer-dist
          python -m pip install -r tests/E2E/requirements.txt

      - name: Run end-to-end suite
        # tests/E2E/run.sh is a bash script; windows-latest runners carry
        # Git Bash, and `shell: bash` (#97) routes there instead of the
        # runner's pwsh default, uniformly across all three OSes.
        shell: bash
        env:
          E2E_PYTHON: python
        run: tests/E2E/run.sh

  # #109: docs/lsp.md's editor snippets rot silently unless something runs
  # them for real -- #94 found the native Neovim `vim.lsp.config` snippet
  # broken on every Neovim that HAS vim.lsp.config, and nothing before this
  # job noticed. Extracts the snippet straight out of docs/lsp.md (marker
  # comments, tests/E2E/nvim/extract_snippet.py) rather than a frozen copy,
  # so a future edit to docs/lsp.md is exactly what this job re-runs against.
  # ubuntu only, per the issue's own "macOS if cheap" -- kept to the pinned
  # minimum version plus whatever Neovim's own `stable` tap currently ships,
  # not a full OS x version cross product.
  headless-nvim:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim_version: ['v0.11.3', 'stable']
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: fileinfo, intl, mbstring

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # Self-review finding: without matrix.nvim_version in the key, both
          # concurrent legs of this matrix (fail-fast: false) race to save
          # the same cache entry -- only one save wins, so the other leg
          # never gets a durable cache. Same reasoning as the `tests` job's
          # own os+php-qualified key above.
          key: composer-headless-nvim-${{ matrix.nvim_version }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Install Neovim (${{ matrix.nvim_version }})
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim_version }}

      - name: Run headless Neovim smoke test
        run: tests/E2E/nvim/run_smoke.sh

  # Same rationale as headless-nvim above, for Helix -- "at minimum" per the
  # issue: one health check, one OS, no version matrix. `hx --health`
  # never sets a non-zero exit code either way, so run_helix_health.sh
  # asserts on the printed text instead (see its own comment).
  headless-helix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: fileinfo, intl, mbstring

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-headless-helix-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Install Helix
        # Self-review finding: this used to resolve "latest" via an
        # unauthenticated api.github.com call (60 req/hour, shared across
        # every runner on this IP) and float to whatever Helix released most
        # recently -- a flaky/moving target unrelated to any README
        # regression. Pinned instead, same convention as headless-nvim's own
        # matrix.nvim_version, and bumped by hand like that job's own pin.
        env:
          HELIX_VERSION: '25.07.1'
        run: |
          curl -fsSL -o helix.tar.xz "https://github.com/helix-editor/helix/releases/download/${HELIX_VERSION}/helix-${HELIX_VERSION}-x86_64-linux.tar.xz"
          tar -xJf helix.tar.xz
          install_dir="$(find . -maxdepth 1 -type d -name 'helix-*' | head -1)"
          echo "$PWD/$install_dir" >> "$GITHUB_PATH"

      - name: Run Helix health check
        run: tests/E2E/nvim/run_helix_health.sh

  # #108: the no-pcntl standby worker under the whole E2E oracle suite on Linux
  # too, not only as a side effect of windows-latest having no pcntl. A job of its
  # own rather than a matrix dimension on `e2e`, so the required `e2e (<os>)`
  # check names stay as they are. E2E_DISABLE_PCNTL makes the harness start the
  # server with the same disable_functions list as the no-pcntl job above.
  e2e-no-pcntl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/E2E/requirements.txt

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-e2e-no-pcntl-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: |
          composer install --no-progress --prefer-dist
          python -m pip install -r tests/E2E/requirements.txt

      - name: Run end-to-end suite without pcntl
        env:
          E2E_PYTHON: python
          E2E_DISABLE_PCNTL: '1'
        run: tests/E2E/run.sh

  # #209/#218: coverage and per-test duration. ubuntu/8.3 matches the `tests`
  # job's own middle-of-the-matrix leg; macOS joined for #218 so a
  # platform-only branch there is reported rather than silently uncovered.
  # pcov only instruments the one process phpunit itself runs in -- a
  # `pcntl_fork()` child (SessionHooks.php, TrackingParser.php, most of
  # RectorRunner.php's own child-side logic) or a `proc_open()` subprocess
  # (every bin/* script) is invisible to that report even though the
  # integration/E2E suites genuinely run it. "Prepare child-process
  # coverage" below points `PHP_INI_SCAN_DIR` at a generated ini that sets
  # `auto_prepend_file = tests/coverage/prepend.php` for every `php`
  # invocation this job's shell session launches from that point on
  # (`proc_open()` inherits the parent's environment unless told otherwise,
  # and none of this repo's call sites override that -- so the subprocess
  # case needs nothing beyond the env var; a `pcntl_fork()` child needs
  # even less, since forking duplicates tests/coverage/prepend.php's
  # already-registered shutdown function along with the rest of the
  # process). "Merge forked/subprocess coverage" folds every one of those
  # processes' own `.cov` file into the one the top-level phpunit run
  # already produced. No coverage threshold enforced here (out of scope:
  # measure first, gate later).
  #
  # Windows is NOT in this matrix: RectorRunner::canFork() is always false
  # there (#31), so there is no forked-child gap on that platform to begin
  # with, and this job's ini-scandir plumbing is only exercised here on
  # Linux/macOS. Its own Windows-only branches (ProcessTree,
  # TempCopySweeper's junction handling) are covered by the separate,
  # deliberately simpler `coverage-windows` job below instead.
  coverage:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flag: linux
          - os: macos-latest
            flag: macos
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer:v2
          extensions: fileinfo, intl, mbstring

      - name: Get composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-coverage-${{ matrix.os }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Prepare child-process coverage (#218)
        shell: bash
        run: |
          mkdir -p .coverage-run/ini-scandir .coverage-run/cov
          # Preserve whatever scan dir setup-php already wired up (that's
          # where pcov's own extension-enabling ini lives) -- PHP_INI_SCAN_DIR
          # replaces the compiled-in scan dir rather than adding to it, so
          # overwriting it outright would silently unload every extension
          # setup-php just enabled.
          # `php --ini` prints "...files in:" with the colon directly adjacent
          # to "in" (no space before it) -- a pattern that only strips spaces
          # after "in" leaves a stray leading ": " on the captured path, which
          # resolves to no real directory. (Reproduced on PHP 8.2/8.3 locally.)
          default_scan_dir="$(php --ini | sed -n 's/^Scan for additional \.ini files in: *//p')"
          {
            printf 'auto_prepend_file = %s/tests/coverage/prepend.php\n' "$PWD"
            # pcov's own default (no ini override) is '<cwd>/src', not the
            # repo root, which would silently exclude bin/* from every
            # proc_open() subprocess -d flags never propagate there, so only
            # an ini directive reaches it the same way auto_prepend_file does.
            printf 'pcov.directory = %s\n' "$PWD"
            # #230 regression: widening pcov.directory to the repo root also
            # instruments vendor/ for every subprocess pcov sees -- harmless
            # for coverage (vendor was never in scope, see #218), but once
            # php-cs-fixer pulled in real symfony/process, symfony/console,
            # symfony/finder etc. as top-level dev deps, vendor/ grew enough
            # that instrumenting it in every wedged-process kill test ate
            # into the DEADLINE_SECONDS=8 margin those tests assert against,
            # failing them on this leg only (coverage: pcov) and nowhere
            # else. Excluding vendor restores the pre-php-cs-fixer scope
            # without touching what #218 set out to measure.
            printf 'pcov.exclude = "~%s/vendor~"\n' "$PWD"
          } > .coverage-run/ini-scandir/zz-mcp-rector-warm-coverage.ini
          if [ -n "$default_scan_dir" ]; then
            echo "PHP_INI_SCAN_DIR=${default_scan_dir}:$PWD/.coverage-run/ini-scandir" >> "$GITHUB_ENV"
          else
            echo "PHP_INI_SCAN_DIR=$PWD/.coverage-run/ini-scandir" >> "$GITHUB_ENV"
          fi
          echo "MCP_RECTOR_WARM_COVERAGE_DIR=$PWD/.coverage-run/cov" >> "$GITHUB_ENV"

      - name: Run tests with coverage
        shell: bash
        run: |
          ./vendor/bin/phpunit --colors=never --no-progress --display-warnings \
            --coverage-php=.coverage-run/cov/00-main.cov \
            --coverage-clover=coverage-before.xml \
            --coverage-text=coverage-before.txt --only-summary-for-coverage-text \
            --log-junit=junit.xml

      - name: Merge forked/subprocess coverage (#218)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          vendor/bin/phpcov merge .coverage-run/cov \
            --clover=coverage.xml \
            --text=coverage-after.txt

      - name: Assert vendor/ was never instrumented (#230)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Guards the pcov.exclude line added for #230: pcov.directory is
          # the repo root (see "Prepare child-process coverage" above), so
          # if the vendor exclude is ever dropped or narrowed, pcov silently
          # goes back to instrumenting vendor/ in every subprocess, which is
          # what ate into the kill tests' DEADLINE_SECONDS margin last time.
          # A clover report is the cheapest place to check: vendor/ should
          # never appear as a covered file.
          if grep -l 'name="vendor/' coverage.xml coverage-before.xml 2>/dev/null; then
            echo "::error::vendor/ is being instrumented by pcov -- check pcov.exclude in the \"Prepare child-process coverage\" step (#230)" >&2
            exit 1
          fi

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Self-check, not a gate (#209 is still "measure, not gate" --
          # this is informational only): .coverage-run/cov always holds at
          # least the top-level run own 00-main.cov, so phpcov merge never
          # fails outright even if every forked child/subprocess silently
          # failed to write its own file -- the job would stay green with
          # before == after and nothing else would say so.
          cov_count=$(find .coverage-run/cov -name "*.cov" | wc -l | tr -d " ")
          {
            if [ "$cov_count" -le 1 ]; then
              echo "### ${{ matrix.os }}: WARNING -- only ${cov_count} .cov file(s) found (#218)"
              echo "Expected the top-level runs own 00-main.cov plus at least one per"
              echo "forked child / proc_open() subprocess. This run produced none of the"
              echo "latter, so the \"after\" numbers below are not measuring anything the"
              echo "fork/subprocess mechanism added."
            else
              echo "### ${{ matrix.os }}: ${cov_count} .cov files merged (#218)"
            fi
            echo "### ${{ matrix.os }}: before merging forked/subprocess children (#218)"
            echo '```text'
            cat coverage-before.txt
            echo '```'
            echo "### ${{ matrix.os }}: after merging forked/subprocess children (#218)"
            echo '```text'
            cat coverage-after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Slowest tests summary
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 tools/slowest-tests.py junit.xml --limit 10 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-log-${{ matrix.os }}
          path: junit.xml

      - name: Upload coverage to Codecov
        # Codecov refuses tokenless uploads for this repo ("Token required"),
        # so this needs the CODECOV_TOKEN repository secret. Without it the
        # upload fails quietly (fail_ci_if_error: false); the coverage % is
        # still in the job summary either way. `files` is the merged
        # (post-#218) report -- coverage-before.xml is informational only,
        # in the job summary, never uploaded.
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: ${{ matrix.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # #218 scope item 4: pcov on a Windows leg too, so its own platform-only
  # branches (ProcessTree, TempCopySweeper's junction handling) are reported
  # rather than silently uncovered, same reasoning as #97/#98 gave the
  # `tests` job its Windows leg. Deliberately NOT the same
  # auto_prepend_file/PHP_INI_SCAN_DIR mechanism as the `coverage` job
  # above: that plumbing is only verified here on Linux/macOS, and
  # RectorRunner::canFork() is always false on Windows (#31) -- there is no
  # forked-child gap on this platform to close, only the main process's own
  # coverage of whatever Windows-only branch a test calls directly.
  coverage-windows:
    runs-on: windows-latest
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer:v2
          extensions: fileinfo, intl, mbstring

      - name: Get composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-coverage-windows-latest-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run tests with coverage
        shell: bash
        run: |
          ./vendor/bin/phpunit --colors=never --no-progress --display-warnings \
            --coverage-clover=coverage.xml \
            --coverage-text=coverage.txt --only-summary-for-coverage-text \
            --log-junit=junit.xml

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '### windows-latest (#218 -- main process only, see job comment)'
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-log-windows-latest
          path: junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: windows
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

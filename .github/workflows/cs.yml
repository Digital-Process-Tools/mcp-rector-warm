name: Code style

# #230: this repo's own code style, checked against itself -- same dogfooding
# spirit as rector.yml and phpstan.yml. Its own workflow (not a job in
# tests.yml) so the README badge reports this check alone. --dry-run --diff
# never writes: it reports what php-cs-fixer would change and fails if
# anything would.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  cs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: fileinfo, intl, mbstring
      - name: Get composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-static-analysis-${{ hashFiles('composer.json') }}
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: php-cs-fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff

# Coverage is measured, not gated (#209). Every PR still uploads, so Codecov
# can compare it with main and report patch coverage, but it posts no comment
# and its status checks never fail a PR.
comment: false
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# #218: one upload per OS leg (`coverage` job's ubuntu/macOS matrix, plus the
# separate `coverage-windows` job), each tagged with its own flag so Codecov
# merges them into one report instead of the last upload winning.
flags:
  linux:
    paths: []
  macos:
    paths: []
  windows:
    paths: []

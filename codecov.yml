# Codecov does not post a codecov/project status or check on this repo (only
# codecov/patch shows up), so nothing here can block a merge. The blocking
# 90% line-coverage gate (#275) is the "Coverage gate (#275)" step at the end
# of each `coverage` leg in .github/workflows/tests.yml, computed from that
# leg's own merged clover report. The project status below is informational:
# the 90% target is kept so Codecov shows the same goal if it ever does post
# the status, but it is not the gate. Patch coverage stays informational too:
# a small PR touching hard-to-test fork/kill paths should not be blocked on
# its own diff's percentage. No PR comment is posted.
comment: false
coverage:
  status:
    project:
      default:
        target: 90%
        informational: true
    patch:
      default:
        informational: true

# #218: one upload per OS leg (`coverage` job's ubuntu/macOS matrix, plus the
# separate `coverage-windows` job). The `flags:` passed to each
# `codecov/codecov-action@v5` call in the workflow (not this file) is what
# makes Codecov merge the three uploads instead of the last one winning; this
# file declares the flag NAMES, with no `paths` restriction, purely so the
# dashboard shows a per-OS breakdown under those names rather than an
# implicit, undeclared flag. An explicit `paths: []` was tried here first and
# dropped: Codecov's own handling of an empty include-list for a flag is not
# documented clearly enough to be sure it does not zero out that flag's
# reported coverage instead of leaving it unrestricted.
flags:
  linux: {}
  macos: {}
  windows: {}
